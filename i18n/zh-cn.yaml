# Hugo 的语言键是 zh-cn（由 defaultContentLanguage 决定），不会自动回退到主题的 zh.yaml，
# 所以这里按 zh-cn 复制一份。内容与 themes/PaperMod/i18n/zh.yaml 一致。
- id: prev_page
  translation: "上一页"

- id: next_page
  translation: "下一页"

- id: read_time
  translation:
    one: "1 分钟"
    other: "{{ .Count }} 分钟"

- id: words
  translation:
    one: "字"
    other: "{{ .Count }} 字"

- id: toc
  translation: "目录"

- id: translations
  translation: "语言"

- id: home
  translation: "主页"

- id: edit_post
  translation: "编辑"

- id: code_copy
  translation: "复制"

- id: code_copied
  translation: "已复制！"
